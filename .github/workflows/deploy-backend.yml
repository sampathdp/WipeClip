name: Deploy backend to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: wipeclip
  REGION: us-central1
  SERVICE: unmarkai-backend
  # Identity the service runs as: reads/deletes UPLOAD_BUCKET and signs its
  # upload URLs (see backend/README.md "Direct uploads").
  RUN_SERVICE_ACCOUNT: wipeclip-backend@wipeclip.iam.gserviceaccount.com
  # Direct video uploads (backend/app/uploads.py). Create it first - see
  # backend/README.md "Direct uploads".
  UPLOAD_BUCKET: wipeclip-uploads

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: backend
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --use-http2 \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 1800 \
            --set-env-vars "ALLOWED_ORIGINS=*" \
            --set-env-vars "GCS_UPLOAD_BUCKET=$UPLOAD_BUCKET" \
            --set-env-vars "INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}" \
            --project "$PROJECT_ID"
