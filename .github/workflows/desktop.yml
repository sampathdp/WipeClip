name: Desktop

# Builds the WipeClip desktop app (Tauri) on a real Windows runner (macOS is off).
# See docs/desktop/README.md. Started by hand (Actions > Desktop > Run
# workflow) with "release" left at none, it uploads the installers as
# workflow artifacts. With release set to patch, minor or major (run on
# master), it first bumps the version and pushes the commit and tag
# desktop-v<version> (desktop/scripts/release.mjs), then builds that tag and
# publishes it. This costs Actions minutes; npm run desktop:release does the
# same on your own Windows machine for free. Once built, a release is
# *published* with the signed installers and latest.json (the app's update
# feed) in the public releases repo (RELEASES_REPO; this code repo can stay
# private): installed apps offer the update and the website serves the
# download from then on, with no manual step. See docs/desktop/RELEASE.md
# (Updates).

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a new version (none = test build only, nothing published)"
        type: choice
        # retry: build and publish the current version's existing tag again
        # (after a run that failed past the version step), no new version.
        options: [none, patch, minor, major, retry]
        default: none
      tests:
        # Off only when the same commit was just tested locally (cargo test
        # and npm run desktop:test:js): cargo test is a full debug build,
        # several of the run's Windows minutes (which count double).
        description: "Run the tests first (turn off if you just ran them locally)"
        type: boolean
        default: true
  # Automatic releases: a push to master that touches the release notes (or
  # this workflow) releases by itself when there's something to release -
  # "next" notes (a patch version), or the current version tagged but never
  # published (a run that failed after tagging). Otherwise the version job
  # finds nothing and the run ends in seconds, on Linux. No tag trigger: the
  # local release (npm run desktop:release) pushes tags itself, and a build
  # here too would burn Windows minutes.
  push:
    branches: [master]
    paths:
      - desktop/release-notes.json
      - .github/workflows/desktop.yml

# One release at a time, so two runs can't claim the same version.
concurrency:
  group: desktop-${{ inputs.release != 'none' && 'release' || github.run_id }}

jobs:
  # The tag being released: the pushed tag, or one made here from the
  # "release" input. Empty for a test build. A tag pushed with this job's
  # token doesn't start another run, so this run builds it itself.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The newest master (runs queue one after another; an earlier one may
      # have pushed a version commit since this run was started), with tags.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # What to do: bump (a new version), retry (publish the current
      # version's existing tag), or nothing.
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          notes=$(node -p 'require("./desktop/release-notes.json").next.length')
          tag="desktop-v${version}"
          # Published already? (public repo; a draft counts as not published)
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/sampathdp/wipeclip-releases/releases/tags/${tag}")
          unpublished=false
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && [ "$code" = "404" ]; then unpublished=true; fi
          mode=none
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$RELEASE" in
              patch|minor|major) mode=bump ;;
              retry) mode=retry ;;
            esac
          elif [ "$notes" -gt 0 ]; then
            mode=bump
          elif [ "$unpublished" = "true" ]; then
            mode=retry
          fi
          if [ "$mode" = "retry" ] && ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} doesn't exist - nothing to retry."; exit 1
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}, ${notes} note(s) waiting, ${tag} published: $([ "$code" = "200" ] && echo yes || echo no) -> ${mode}"

      - name: Bump version, commit and tag
        if: steps.plan.outputs.mode == 'bump'
        env:
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'patch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node desktop/scripts/release.mjs "$KIND"

      - id: tag
        shell: bash
        run: |
          if [ "${{ steps.plan.outputs.mode }}" != "none" ]; then
            echo "tag=desktop-v$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    # A push with nothing to release builds nothing (no Windows minutes);
    # a manual run with release "none" is a test build.
    if: needs.version.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.release == 'none')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # macOS builds are off for now (releases are Windows only). To turn
          # them back on, restore this entry:
          # - os: macos-latest # Apple Silicon
          #   bundles: app,dmg
    runs-on: ${{ matrix.os }}
    # Windows minutes count double against the free quota: a stuck build
    # shouldn't burn hours before GitHub's 6-hour default kills it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Automatic releases (push) skip the Rust tests - a full debug build,
      # several Windows minutes; they're run locally before pushing. The JS
      # tests are quick and always run there.
      - name: Rust unit tests
        if: inputs.tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: JS desktop tests
        if: inputs.tests || github.event_name == 'push'
        run: npm run desktop:test:js

      # Public values only (repository *variables*, not secrets): they are
      # compiled into the app. Server secrets never belong here.
      - name: Desktop build env
        shell: bash
        run: |
          {
            echo "NEXT_PUBLIC_DESKTOP_SITE_ORIGIN=${{ vars.DESKTOP_SITE_ORIGIN || 'https://www.wipeclip.co' }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "NEXT_PUBLIC_TOOLS_API_URL=${{ vars.NEXT_PUBLIC_TOOLS_API_URL }}"
          } > desktop/.env.production.local

      # macOS signing and notarization: only when the secrets exist, since
      # Tauri treats an empty APPLE_CERTIFICATE as "import this" and fails.
      - name: Apple signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v<<EOF" >> "$GITHUB_ENV"; echo "${!v}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No Apple signing secrets - the macOS build is unsigned and Gatekeeper will block it."
          fi

      # The local processing engine (backend/desktop.spec): the website's own
      # backend, bundled so the app processes video on the user's machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      # PyInstaller signs every binary it collects when given an identity,
      # which notarization needs; the certificate must be in a keychain first.
      - name: Import signing certificate for the engine
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build the engine
        working-directory: backend
        shell: bash
        run: |
          pip install -r requirements-desktop.txt
          python -m app.pipeline.nsfw_classifier
          python -m app.pipeline.matte
          python -m app.pipeline.ocr
          pyinstaller desktop.spec --noconfirm
          mkdir -p ../src-tauri/resources
          rm -rf ../src-tauri/resources/engine
          cp -R dist/wipeclip-engine ../src-tauri/resources/engine

      # TAURI_SIGNING_PRIVATE_KEY signs the update bundles (not the code
      # signing certificate). Required for release tags.
      # NEXT_PUBLIC_*: the public values from desktop/.env.example, set as
      # repository variables (they're compiled into the app, so not secrets).
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TOOLS_API_URL: ${{ vars.NEXT_PUBLIC_TOOLS_API_URL }}
          NEXT_PUBLIC_DESKTOP_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_DESKTOP_SITE_ORIGIN || 'https://www.wipeclip.co' }}
          WIPECLIP_REQUIRE_ENGINE: "1"
          WIPECLIP_REQUIRE_UPDATER: ${{ needs.version.outputs.tag != '' && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      # Test builds (no tag): the installer as a workflow artifact to
      # download. Kept a day so old installers don't fill the storage quota.
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.tag == ''
        with:
          name: wipeclip-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Releases (a tag): published straight from this job to the releases
      # repo, with no workflow artifacts in between - the account's artifact
      # storage is too small for installers. Windows is the only platform
      # built; with macOS back on, its job needs to publish into the same
      # release (or bring back a separate release job).
      # RELEASES_TOKEN: a fine-grained token with Contents read/write on the
      # releases repo only (this job's own token can't write to another repo).
      - name: Release assets and update feed
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RELEASES_REPO: sampathdp/wipeclip-releases
        run: node desktop/scripts/update-manifest.mjs src-tauri/target/release/bundle release "${TAG}" "${RELEASES_REPO}" release-notes.md

      # Published at once as the latest release: installed apps see it on
      # their next update check.
      - name: Publish release
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          # Public repo holding only installers and the update feed; must match
          # plugins.updater.endpoints in src-tauri/tauri.conf.json.
          RELEASES_REPO: sampathdp/wipeclip-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN secret is missing - see docs/desktop/RELEASE.md (Updates)."; exit 1; fi
          # A retry: a release a failed run left unfinished (a draft, or
          # missing files) is replaced. Nothing to remove otherwise.
          gh release delete "${TAG}" --repo "${RELEASES_REPO}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" release/* --repo "${RELEASES_REPO}" --latest             --title "WipeClip ${TAG#desktop-v}"             --notes-file release-notes.md
