name: Desktop

# Builds the WipeClip desktop app (Tauri) on real Windows and macOS runners.
# See docs/desktop/README.md. Runs on demand and on PRs touching desktop
# code; it never publishes anything - installers are uploaded as workflow
# artifacts only.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths:
      - "desktop/**"
      - "src-tauri/**"
      - "src/lib/platform/**"
      - "src/lib/cors.ts"
      - "tests/desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest # Apple Silicon
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: JS desktop tests
        run: npm run desktop:test:js

      # Public values only (repository *variables*, not secrets): they are
      # compiled into the app. Server secrets never belong here.
      - name: Desktop build env
        shell: bash
        run: |
          {
            echo "NEXT_PUBLIC_DESKTOP_SITE_ORIGIN=${{ vars.DESKTOP_SITE_ORIGIN || 'https://www.wipeclip.co' }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "NEXT_PUBLIC_TOOLS_API_URL=${{ vars.NEXT_PUBLIC_TOOLS_API_URL }}"
          } > desktop/.env.production.local

      # macOS signing and notarization: only when the secrets exist, since
      # Tauri treats an empty APPLE_CERTIFICATE as "import this" and fails.
      - name: Apple signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v<<EOF" >> "$GITHUB_ENV"; echo "${!v}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No Apple signing secrets - the macOS build is unsigned and Gatekeeper will block it."
          fi

      - name: Build
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: wipeclip-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
