<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111d" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="fav-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="2" />

  <!-- Subtle Shutter Arc -->
  <path d="M 24 16 C 36 14, 48 20, 52 30" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 12 34 C 14 46, 26 52, 38 50" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Bold Central 'W' -->
  <path
    d="M 17 24 L 24 46 L 32 31 L 40 46 L 47 24"
    stroke="url(#fav-brand)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Crisp AI Star -->
  <path
    d="M 50 9.5
       C 50.5 13.5, 51.5 14.5, 55 15
       C 51.5 15.5, 50.5 16.5, 50 20.5
       C 49.5 16.5, 48.5 15.5, 45 15
       C 48.5 14.5, 49.5 13.5, 50 9.5
       Z"
    fill="#ffffff"
  />
</svg>
