<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#05060a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c5cff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Brand Vibrant Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Violet/Cyan Glow Filter -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="180" fill="url(#center-glow)" />

  <!-- Shutter / Lens Frame Aperture Arc Ribs -->
  <g opacity="0.35" stroke="url(#brand-grad)" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Top-Right Arc -->
    <path d="M 210 148 C 265 140, 320 160, 360 200 C 378 218, 388 240, 394 265" />
    <!-- Bottom-Right Arc -->
    <path d="M 390 280 C 382 335, 350 380, 300 405 C 275 416, 245 418, 218 412" />
    <!-- Bottom-Left Arc -->
    <path d="M 190 405 C 145 385, 118 345, 114 295 C 112 268, 120 240, 134 216" />
    <!-- Top-Left Arc -->
    <path d="M 145 195 C 172 155, 215 130, 268 124" />
  </g>

  <!-- Outer Glass Ring Petals -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="3">
    <circle cx="256" cy="256" r="145" stroke-dasharray="14 18" />
  </g>

  <!-- Central Hero Geometric 'W' Monogram -->
  <g filter="url(#glow-purple)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main W Body -->
    <path d="M 160 200 L 210 370 L 256 255 L 302 370 L 352 200" stroke="url(#brand-grad)" stroke-width="40" />

    <!-- Inner Bevel Highlight -->
    <path d="M 160 200 L 210 370 L 256 255 L 302 370 L 352 200" stroke="#ffffff" stroke-width="10" opacity="0.28" />
  </g>

  <!-- Futuristic AI 4-Point Star Sparkle above the Right Tip -->
  <g transform="translate(386, 140)" filter="url(#glow-cyan)">
    <!-- Star Glow Backing -->
    <circle cx="0" cy="0" r="14" fill="#22d3ee" opacity="0.4" filter="url(#glow-cyan)" />
    <!-- 4-Point Diamond Flare -->
    <path
      d="M 0 -36
         C 1 -12, 12 -1, 36 0
         C 12 1, 1 12, 0 36
         C -1 12, -12 1, -36 0
         C -12 -1, -1 -12, 0 -36
         Z"
      fill="#e0f7fa"
    />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Secondary Tiny Micro-Sparkle -->
  <g transform="translate(126, 372)">
    <path
      d="M 0 -14
         C 0.5 -4, 4 -0.5, 14 0
         C 4 0.5, 0.5 4, 0 14
         C -0.5 4, -4 0.5, -14 0
         C -4 -0.5, -0.5 -4, 0 -14
         Z"
      fill="#a78bfa"
      opacity="0.85"
    />
  </g>
</svg>
